name: Build and release

# Every push to main is released: the next patch version is tagged, built, published and put
# in the Homebrew tap. Bump VERSION by hand to start a new minor or major version.
on:
  push:
    branches: [main]
  workflow_dispatch: # re-release the current main (same version if it's already tagged)

permissions:
  contents: write

# One release at a time, in push order, so two quick pushes don't pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-app.sh numbers builds by commit count

      - name: Pick version
        run: |
          version="$(./scripts/next-version.sh)"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "Releasing $version"

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      - name: Cache bundled tools
        uses: actions/cache@v4
        with:
          path: vendor/tools
          key: tools-${{ hashFiles('scripts/fetch-tools.sh') }}

      - name: Unit tests
        run: swift test

      # Developer ID signing and notarization, used when these secrets are set (else ad-hoc):
      #   DEVELOPER_ID_P12           base64 of the exported "Developer ID Application" .p12
      #   DEVELOPER_ID_P12_PASSWORD  its export password
      #   NOTARY_KEY_P8              base64 of an App Store Connect API key (AuthKey_XXXX.p8)
      #   NOTARY_KEY_ID, NOTARY_ISSUER  that key's ID and the issuer ID
      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::warning::DEVELOPER_ID_P12 not set; building ad-hoc signed (users get a Gatekeeper warning)"
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 16)"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity in DEVELOPER_ID_P12"
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing as $identity"
          if [[ -n "$KEY_P8" ]]; then
            echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            {
              echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8"
              echo "NOTARY_KEY_ID=$KEY_ID"
              echo "NOTARY_ISSUER=$ISSUER"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::NOTARY_KEY_P8 not set; signed but not notarized"
          fi

      - name: Build release zip and cask
        run: ./scripts/release.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeTool
          path: dist/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/YouTubeTool-*.zip dist/youtube-tool.rb)
          # Re-runs replace the assets so the zip and the cask checksum always match.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" \
              --title "YouTube Tool $APP_VERSION" --generate-notes
          fi

      # HOMEBREW_TAP_TOKEN: fine-grained personal access token limited to
      # mkrajinov/homebrew-tap with Contents read/write. Skipped when the secret isn't set.
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; copy youtube-tool.rb from the release to the tap's Casks/ by hand"
            exit 0
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mkrajinov/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp dist/youtube-tool.rb tap/Casks/youtube-tool.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/youtube-tool.rb
          if git diff --cached --quiet; then
            echo "Tap already up to date"
            exit 0
          fi
          git commit -m "youtube-tool ${TAG}"
          git push

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
